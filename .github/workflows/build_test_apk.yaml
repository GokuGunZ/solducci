name: Build Test APK

on:
  push:
    branches:
      - test

jobs:
  build_test_apk:
    name: Build Flutter Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create Key Properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=upload-keystore.jks" > key.properties
          echo "storePassword=$KEY_STORE_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
        working-directory: android

      - name: Create dummy .env file
        run: |
          mkdir -p assets/dev
          touch assets/dev/.env

      - name: Rename App for Testing
        run: |
          sed -i 's/applicationId = "com.gokugunz.solducci"/applicationId = "com.gokugunz.solducci.test"/' android/app/build.gradle.kts
          sed -i 's/android:label="solducci"/android:label="Solducci Test"/' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK (Signed)
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GSHEET_CREDENTIALS="$GSHEET_CREDENTIALS" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Clean up sensitive files
        run: rm -f android/app/upload-keystore.jks android/key.properties android/app/google-services.json assets/dev/.env

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solducci-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
